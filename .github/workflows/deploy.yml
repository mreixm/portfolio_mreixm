name: Deploy HTML Site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
# se voce estiver usando o github
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4